    <!-- Script da Aplicação FinCasal AI -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const MONTHS_LIST = [
        { key: '2026-07', label: 'Julho 2026' },
        { key: '2026-08', label: 'Agosto 2026' },
        { key: '2026-09', label: 'Setembro 2026' },
        { key: '2026-10', label: 'Outubro 2026' },
        { key: '2026-11', label: 'Novembro 2026' },
        { key: '2026-12', label: 'Dezembro 2026' }
      ];

      const CATEGORIES_CONFIG = {
        'Alimentação': { pillar: 'needs', icon: '🛒', color: '#10b981', keywords: ['mercado', 'supermercado', 'feira', 'padaria', 'sacolão', 'açougue', 'compras'] },
        'Moradia': { pillar: 'needs', icon: '🏠', color: '#3b82f6', keywords: ['aluguel', 'apartamento', 'parcela apartamento', 'condomínio', 'condominio', 'iptu', 'reforma'] },
        'Contas Essenciais': { pillar: 'needs', icon: '💡', color: '#06b6d4', keywords: ['luz', 'energia', 'gás', 'gas', 'água', 'saneamento', 'internet', 'wifi', 'celular'] },
        'Saúde': { pillar: 'needs', icon: '💊', color: '#ec4899', keywords: ['farmácia', 'remédio', 'médico', 'consulta', 'exame', 'dentista'] },
        'Transporte': { pillar: 'needs', icon: '🚗', color: '#6366f1', keywords: ['parcela carro', 'carro', 'combustível', 'gasolina', 'etanol', 'uber', '99', 'estacionamento'] },
        'Lazer & Passeios': { pillar: 'wants', icon: '🍿', color: '#f59e0b', keywords: ['cinema', 'filme', 'passeio', 'show', 'teatro', 'viagem', 'praia'] },
        'Restaurante': { pillar: 'wants', icon: '🍽️', color: '#f97316', keywords: ['restaurante', 'almoço', 'jantar', 'ifood', 'delivery', 'pizza', 'hambúrguer', 'bar', 'cerveja'] },
        'Assinaturas & Tech': { pillar: 'wants', icon: '📺', color: '#8b5cf6', keywords: ['netflix', 'spotify', 'prime', 'disney', 'youtube', 'game', 'psn', 'chatgpt'] },
        'Compras Pessoais': { pillar: 'wants', icon: '🛍️', color: '#d946ef', keywords: ['roupa', 'sapato', 'tênis', 'cosmético', 'presente', 'salão', 'barbeiro'] },
        'Reserva de Emergência': { pillar: 'future', icon: '🛡️', color: '#10b981', keywords: ['reserva', 'emergência', 'emergencia', 'guardar', 'guardei', 'poupança', 'poupanca', 'economia', 'economizei'] },
        'Investimentos': { pillar: 'future', icon: '📈', color: '#059669', keywords: ['investimento', 'investi', 'ações', 'fii', 'tesouro', 'cdb', 'cripto', 'aporte'] },
        'Salário & Rendimentos': { pillar: 'income', icon: '💰', color: '#22c55e', keywords: ['salário', 'salario', 'pagamento', 'freelance', 'pix', 'rendimento', 'bônus', 'bonus', 'receita', 'recebi', 'ganhei', 'ganho', 'faturei', 'faturamento', 'depósito', 'deposito', 'entrada', 'prolabore', 'comissão', 'comissao', 'venda', 'reembolso', 'cashback'] }
      };

      // MOTOR SINTETIZADOR DE EFEITOS SONOROS E ANIMAÇÕES
      function playAudioFx(type) {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;

          if (type === 'expense') {
            // EFEITO: Caixa Registradora Abrindo (Cha-Ching!)
            const noise = ctx.createBufferSource();
            const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0.3, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
            noise.connect(noiseGain);
            noiseGain.connect(ctx.destination);
            noise.start(now);

            // Chime de Metal (B5 + E6)
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();
            osc1.type = 'sine'; osc1.frequency.setValueAtTime(987.77, now + 0.03); // B5
            osc2.type = 'sine'; osc2.frequency.setValueAtTime(1318.51, now + 0.08); // E6
            gain.gain.setValueAtTime(0.25, now + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc1.connect(gain); osc2.connect(gain);
            gain.connect(ctx.destination);
            osc1.start(now + 0.03); osc1.stop(now + 0.35);
            osc2.start(now + 0.08); osc2.stop(now + 0.4);
          } else if (type === 'income') {
            // EFEITO: Aplausos / Melodia de Sucesso (C5 -> E5 -> G5 -> C6)
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);
              gain.gain.setValueAtTime(0.25, now + idx * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.35);
            });
          } else if (type === 'wishlist') {
            // EFEITO: Fanfarra de Conquista 🎉
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + idx * 0.07);
              gain.gain.setValueAtTime(0.3, now + idx * 0.07);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.07);
              osc.stop(now + idx * 0.07 + 0.45);
            });
          }
        } catch (e) {
          console.warn('Audio FX error:', e);
        }
      }

      function triggerCelebration(type) {
        playAudioFx(type);
        if (!window.confetti) return;

        if (type === 'expense') {
          // Chuva de Cifrões e Dinheiro 💲 💸 💰
          if (window.confetti.shapeFromText) {
            const s1 = window.confetti.shapeFromText({ text: '💲' });
            const s2 = window.confetti.shapeFromText({ text: '💸' });
            const s3 = window.confetti.shapeFromText({ text: '💰' });
            window.confetti({ shapes: [s1, s2, s3], scalar: 2.2, particleCount: 30, spread: 60, origin: { y: 0.6 } });
          } else {
            window.confetti({ particleCount: 40, spread: 60, origin: { y: 0.6 } });
          }
        } else if (type === 'income') {
          // Chuva de Moedas de Ouro & Estrelas 💰 🪙 ✨
          if (window.confetti.shapeFromText) {
            const s1 = window.confetti.shapeFromText({ text: '💰' });
            const s2 = window.confetti.shapeFromText({ text: '🪙' });
            const s3 = window.confetti.shapeFromText({ text: '✨' });
            window.confetti({ shapes: [s1, s2, s3], scalar: 2.2, particleCount: 45, spread: 70, origin: { y: 0.6 } });
          } else {
            window.confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
          }
        } else if (type === 'wishlist') {
          // Animação de Festa com Confete Colorido 🎉
          window.confetti({ particleCount: 110, spread: 85, origin: { y: 0.6 } });
        }
      }

      function calculateRequiredXP(price) {
        return Math.max(20, Math.ceil((parseFloat(price) || 0) / 5));
      }

      function parseTransactionMessage(text, currentUserName = 'Kevin', selectedMonthKey = '2026-07') {
        if (!text) return null;
        const raw = text.trim();
        const lower = raw.toLowerCase();

        const amountMatch = lower.match(/(?:r\$\s*)?(\d+(?:[\.,]\d{1,2})?)/i);
        if (!amountMatch) {
          return { success: false, error: 'Não consegui identificar o valor. Fale ou escreva por exemplo: "Mercado 150" ou "Receita 500"' };
        }

        const amount = parseFloat(amountMatch[1].replace(',', '.'));
        if (isNaN(amount) || amount <= 0) return { success: false, error: 'Valor inválido. Tente um valor maior que zero.' };

        // RECONHECIMENTO DE ENTRADAS / RECEITAS
        const incomeKeywords = CATEGORIES_CONFIG['Salário & Rendimentos'].keywords;
        const isIncome = incomeKeywords.some(kw => lower.includes(kw));

        const type = isIncome ? 'income' : 'expense';

        let matchedCategory = isIncome ? 'Salário & Rendimentos' : 'Outros';
        let matchedPillar = isIncome ? 'income' : 'wants';

        if (!isIncome) {
          let maxScore = 0;
          for (const [cat, cfg] of Object.entries(CATEGORIES_CONFIG)) {
            if (cat === 'Salário & Rendimentos') continue;
            for (const kw of cfg.keywords) {
              if (lower.includes(kw) && kw.length > maxScore) {
                maxScore = kw.length;
                matchedCategory = cat;
                matchedPillar = cfg.pillar;
              }
            }
          }
        }

        let description = raw.replace(/(?:r\$\s*)?\d+(?:[\.,]\d{1,2})?/gi, '').replace(/\b(fixo|fixa|para|de|do|da|com|\+-)\b/gi, '').trim();
        if (!description) description = matchedCategory;

        const [year, month] = selectedMonthKey.split('-');
        const createdDate = new Date(parseInt(year), parseInt(month) - 1, 15, 12, 0).toISOString();

        const xpEarned = isIncome ? 30 : (matchedPillar === 'future' ? 25 : 15);
        
        let botReply = '';
        if (isIncome) {
          botReply = `💰 *ENTRADA/RECEITA REGISTRADA!* R$ ${amount.toFixed(2)} (${description}) adicionados à renda do casal por ${currentUserName}! +${xpEarned} XP! ✨`;
        } else if (matchedPillar === 'future') {
          botReply = `🛡️ *RESERVA/ECONOMIA REGISTRADA!* R$ ${amount.toFixed(2)} guardados em ${matchedCategory} por ${currentUserName}! +${xpEarned} XP! 📈`;
        } else {
          botReply = `✅ Registrado, ${currentUserName}! R$ ${amount.toFixed(2)} em *${description}* (${matchedCategory}). +${xpEarned} XP gerados! 🚀`;
        }

        return {
          success: true,
          type,
          data: {
            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
            type,
            amount,
            description: description.charAt(0).toUpperCase() + description.slice(1),
            category: matchedCategory,
            pillar: matchedPillar,
            user: currentUserName,
            date: createdDate,
            monthKey: selectedMonthKey,
            xpEarned
          },
          botReply
        };
      }

      function App() {
        const [tab, setTab] = useState('chat');
        const [selectedMonth, setSelectedMonth] = useState('2026-07');
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [isSynced, setIsSynced] = useState(false);

        const [profile, setProfileState] = useState({ partner1: 'Kevin', partner2: 'Milena', incomePartner1: 5000, incomePartner2: 4500, avatar1: '💙', avatar2: '💜' });
        const [activeUser, setActiveUser] = useState('Kevin');
        const [config, setConfigState] = useState({ targetNeeds: 60, targetWants: 25, targetFuture: 15 });
        const [transactions, setTransactionsState] = useState([]);
        const [chatMessages, setChatMessagesState] = useState([]);
        const [gamification, setGamificationState] = useState({ level: 3, levelTitle: 'Mestres do Planejamento 🏆', xp: 420, xpNextLevel: 500, streakDays: 5, quests: [], badges: [] });
        const [wishlist, setWishlistState] = useState([]);

        const isLocalChange = useRef(false);

        const syncToServer = (partialState) => {
          isLocalChange.current = true;
          fetch('/api/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(partialState)
          }).catch(err => console.error('Erro na sincronização:', err));
        };

        const setTransactions = (updater) => {
          setTransactionsState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            syncToServer({ transactions: next });
            return next;
          });
        };

        const setChatMessages = (updater) => {
          setChatMessagesState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            syncToServer({ chatMessages: next });
            return next;
          });
        };

        const setGamification = (updater) => {
          setGamificationState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            syncToServer({ gamification: next });
            return next;
          });
        };

        const setWishlist = (updater) => {
          setWishlistState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            syncToServer({ wishlist: next });
            return next;
          });
        };

        const setConfig = (updater) => {
          setConfigState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            syncToServer({ config: next });
            return next;
          });
        };

        const setProfile = (updater) => {
          setProfileState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            syncToServer({ profile: next });
            return next;
          });
        };

        useEffect(() => {
          const fetchSync = () => {
            fetch('/api/sync')
              .then(res => res.json())
              .then(data => {
                if (data) {
                  if (data.profile) setProfileState(data.profile);
                  if (data.config) setConfigState(data.config);
                  if (data.transactions) setTransactionsState(data.transactions);
                  if (data.chatMessages) setChatMessagesState(data.chatMessages);
                  if (data.gamification) setGamificationState(data.gamification);
                  if (data.wishlist) setWishlistState(data.wishlist);
                  setIsSynced(true);
                }
              }).catch(e => console.warn('Sync offline'));
          };

          fetchSync();
          const pollTimer = setInterval(fetchSync, 2500);

          let evtSource;
          try {
            evtSource = new EventSource('/api/events');
            evtSource.onmessage = (event) => {
              const data = JSON.parse(event.data);
              if (data) {
                if (data.profile) setProfileState(data.profile);
                if (data.config) setConfigState(data.config);
                if (data.transactions) setTransactionsState(data.transactions);
                if (data.chatMessages) setChatMessagesState(data.chatMessages);
                if (data.gamification) setGamificationState(data.gamification);
                if (data.wishlist) setWishlistState(data.wishlist);
                setIsSynced(true);
              }
            };
          } catch (e) {}

          return () => {
            clearInterval(pollTimer);
            if (evtSource) evtSource.close();
          };
        }, []);

        const [editingTx, setEditingTx] = useState(null);
        const [editingWishItem, setEditingWishItem] = useState(null);
        const [isAddWishModalOpen, setIsAddWishModalOpen] = useState(false);

        const [newWishName, setNewWishName] = useState('');
        const [newWishPrice, setNewWishPrice] = useState('');
        const [newWishCategory, setNewWishCategory] = useState('Compras Pessoais');

        const messagesEndRef = useRef(null);
        const [inputText, setInputText] = useState('');
        const [isRecording, setIsRecording] = useState(false);
        const [recordStatusText, setRecordStatusText] = useState('Escutando sua voz...');

        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [chatMessages, tab]);

        const currentMonthTx = transactions.filter(t => {
          if (t.monthKey) return t.monthKey === selectedMonth;
          const tDate = new Date(t.date);
          return `${tDate.getFullYear()}-${String(tDate.getMonth() + 1).padStart(2, '0')}` === selectedMonth;
        });

        // Ações do Extrato
        const handleDeleteTx = (id) => {
          if (confirm('Deseja realmente apagar este lançamento do extrato?')) {
            setTransactions(prev => prev.filter(t => t.id !== id));
          }
        };

        const handleSaveEditTx = (e) => {
          e.preventDefault();
          if (!editingTx) return;
          setTransactions(prev => prev.map(t => t.id === editingTx.id ? editingTx : t));
          setEditingTx(null);
        };

        // Ações da Wishlist
        const handleAddWishItem = (e) => {
          e.preventDefault();
          if (!newWishName || !newWishPrice || parseFloat(newWishPrice) <= 0) return;

          const price = parseFloat(newWishPrice);
          const xpReq = calculateRequiredXP(price);

          const newItem = {
            id: Date.now().toString(),
            name: newWishName,
            price,
            category: newWishCategory,
            purchased: false,
            xpRequired: xpReq,
            addedBy: activeUser
          };

          setWishlist(prev => [newItem, ...prev]);
          setIsAddWishModalOpen(false);
          setNewWishName('');
          setNewWishPrice('');
        };

        const handleDeleteWishItem = (id) => {
          if (confirm('Deseja remover este item da lista de desejos?')) {
            setWishlist(prev => prev.filter(w => w.id !== id));
          }
        };

        const handleSaveEditWish = (e) => {
          e.preventDefault();
          if (!editingWishItem) return;
          const updatedReqXP = calculateRequiredXP(editingWishItem.price);
          setWishlist(prev => prev.map(w => w.id === editingWishItem.id ? { ...editingWishItem, xpRequired: updatedReqXP } : w));
          setEditingWishItem(null);
        };

        const handleBuyWishItem = (item) => {
          if (gamification.xp < item.xpRequired) {
            alert(`🔒 XP insuficiente! Vocês possuem ${gamification.xp} XP acumulados, mas este item exige ${item.xpRequired} XP.\n\nContinue registrando os gastos da casa no Chat para acumular os ${item.xpRequired - gamification.xp} XP que faltam!`);
            return;
          }

          if (confirm(`🎉 Parabéns! Vocês possuem XP suficiente (${gamification.xp} XP >= ${item.xpRequired} XP).\n\nDeseja marcar "${item.name}" (R$ ${item.price.toFixed(2)}) como COMPRADO e lançar no extrato deste mês?`)) {
            triggerCelebration('wishlist');

            setWishlist(prev => prev.map(w => w.id === item.id ? { ...w, purchased: true } : w));

            const [year, month] = selectedMonth.split('-');
            const createdDate = new Date(parseInt(year), parseInt(month) - 1, 15, 12, 0).toISOString();

            const buyTx = {
              id: Date.now().toString(),
              type: 'expense',
              amount: item.price,
              description: `🛍️ [Wishlist] ${item.name}`,
              category: item.category,
              pillar: 'wants',
              user: activeUser,
              date: createdDate,
              monthKey: selectedMonth
            };

            setTransactions(prev => [buyTx, ...prev]);

            setGamification(g => ({
              ...g,
              badges: g.badges.map(b => b.id === 'b3' ? { ...b, unlocked: true } : b)
            }));
          }
        };

        const handleSendMsg = (text = inputText) => {
          if (!text || !text.trim()) return;
          const cleanText = text.replace(/^🎙️.*?: /, '');
          const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const userMsg = { id: Date.now().toString(), sender: activeUser, type: 'text', content: text, timestamp: time };
          const result = parseTransactionMessage(cleanText, activeUser, selectedMonth);

          let botMsg = null;
          if (result.success) {

            setGamification(g => {
              const newXP = g.xp + result.data.xpEarned;
              const nextLvl = newXP >= g.xpNextLevel;
              return { ...g, xp: newXP, level: nextLvl ? g.level + 1 : g.level, xpNextLevel: nextLvl ? g.xpNextLevel + 300 : g.xpNextLevel };
            });

            // DISPARO DE ANIMAÇÃO E SOM DE ACORDO COM O TIPO DE ENTRADA OU SAÍDA
            if (result.type === 'income') {
              triggerCelebration('income'); // Moedas/Estrelas + Som de Aplausos!
            } else {
              triggerCelebration('expense'); // Cifrões + Barulho de Caixa Registradora!
            }

            botMsg = { id: (Date.now() + 1).toString(), sender: 'Bot', type: 'bot', content: result.botReply, timestamp: time };
          } else {
            botMsg = { id: (Date.now() + 1).toString(), sender: 'Bot', type: 'bot', content: `🤔 ${result.error}`, timestamp: time };
          }

          setChatMessages(prev => [...prev, userMsg, botMsg]);
          setInputText('');
        };

        const handleStartVoiceRecord = () => {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

          if (!SpeechRecognition) {
            alert('ℹ️ No seu celular atual, o navegador exige conexão HTTPS para liberar o microfone por voz.\n\nAmanhã, assim que você publicar no Cloudflare Pages (com https://), o microfone do celular funcionará 100% perfeitamente!');
            return;
          }

          try {
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = false;
            recognition.interimResults = false;

            setIsRecording(true);
            setRecordStatusText('🎙️ Fale agora o gasto (ex: "Mercado 250" ou "Receita 500")...');

            recognition.onstart = () => {
              setRecordStatusText('🎙️ Escutando sua voz... Pode falar!');
            };

            recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              setIsRecording(false);
              if (transcript) {
                handleSendMsg(`🎙️ [Áudio de ${activeUser}]: ${transcript}`);
              }
            };

            recognition.onerror = (event) => {
              console.warn('Erro voz:', event.error);
              setIsRecording(false);
              if (event.error === 'not-allowed') {
                alert('⚠️ Permissão de microfone negada. Permita o uso do microfone nas configurações do navegador!');
              } else {
                alert('ℹ️ Dica: No celular, o microfone por voz funcionará 100% assim que estiver no Cloudflare Pages (com HTTPS seguro).');
              }
            };

            recognition.onend = () => {
              setIsRecording(false);
            };

            recognition.start();

            console.error('Speech error:', err);
            setIsRecording(false);
          }

                    <div className="glass-panel p-5 sm:p-6 rounded-3xl max-w-md w-full border border-slate-700 space-y-4">
                      <h3 className="font-extrabold text-sm sm:text-base text-white">Editar Item da Wishlist</h3>
                      <form onSubmit={handleSaveEditWish} className="space-y-3 text-xs">
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Nome do Item</label>
                          <input type="text" value={editingWishItem.name} onChange={e => setEditingWishItem({ ...editingWishItem, name: e.target.value })} className="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700" />
                        </div>
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Valor Estimado R$</label>
                          <input type="number" step="0.01" value={editingWishItem.price} onChange={e => setEditingWishItem({ ...editingWishItem, price: parseFloat(e.target.value) || 0 })} className="w-full bg-slate-900 text-white font-bold p-2.5 rounded-xl border border-slate-700" />
                          <span className="text-[10px] text-amber-300 font-bold mt-1 block">
                            ⭐ XP recalculado: {calculateRequiredXP(editingWishItem.price)} XP
                          </span>
                        </div>
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Categoria</label>
                          <select value={editingWishItem.category} onChange={e => setEditingWishItem({ ...editingWishItem, category: e.target.value })} className="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700">
                            <option value="Compras Pessoais">Compras Pessoais</option>
                            <option value="Lazer & Passeios">Lazer & Passeios</option>
                            <option value="Assinaturas & Tech">Assinaturas & Tech</option>
                            <option value="Restaurante">Restaurante</option>
                          </select>
                        </div>
                        <div className="flex justify-end gap-2 pt-2">
                          <button type="button" onClick={() => setEditingWishItem(null)} className="px-3 py-2 text-slate-400 hover:text-white font-bold">Cancelar</button>
                          <button type="submit" className="px-4 py-2 bg-pink-600 text-white font-bold rounded-xl">Salvar Alterações</button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}

                {editingTx && (
                  <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4">
                    <div className="glass-panel p-5 sm:p-6 rounded-3xl max-w-md w-full border border-slate-700 space-y-4">
                      <h3 className="font-extrabold text-sm sm:text-base text-white">Editar Lançamento</h3>
                      <form onSubmit={handleSaveEditTx} className="space-y-3 text-xs">
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Descrição</label>
                          <input type="text" value={editingTx.description} onChange={e => setEditingTx({ ...editingTx, description: e.target.value })} className="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700" />
                        </div>
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Valor R$</label>
                          <input type="number" step="0.01" value={editingTx.amount} onChange={e => setEditingTx({ ...editingTx, amount: parseFloat(e.target.value) || 0 })} className="w-full bg-slate-900 text-white font-bold p-2.5 rounded-xl border border-slate-700" />
                        </div>
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Categoria</label>
                          <select value={editingTx.category} onChange={e => setEditingTx({ ...editingTx, category: e.target.value, pillar: CATEGORIES_CONFIG[e.target.value]?.pillar || editingTx.pillar })} className="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700">
                            {Object.keys(CATEGORIES_CONFIG).map(cat => <option key={cat} value={cat}>{cat}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-slate-400 font-bold block mb-1">Quem Lançou</label>
                          <select value={editingTx.user} onChange={e => setEditingTx({ ...editingTx, user: e.target.value })} className="w-full bg-slate-900 text-white p-2.5 rounded-xl border border-slate-700">
                            <option value={profile.partner1}>{profile.partner1}</option>
                            <option value={profile.partner2}>{profile.partner2}</option>
                          </select>
                        </div>
                        <div className="flex justify-end gap-2 pt-2">
                          <button type="button" onClick={() => setEditingTx(null)} className="px-3 py-2 text-slate-400 hover:text-white font-bold">Cancelar</button>
                          <button type="submit" className="px-4 py-2 bg-emerald-500 text-white font-bold rounded-xl">Salvar Alterações</button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}

              </main>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
